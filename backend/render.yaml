# Render Deployment Configuration for SwasthyaSaathi Backend
services:
  - type: web
    name: swasthya-saathi-backend
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt && python app/rag/ingest.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VECTOR_STORE_DIR
        value: ./data/vector_store
      - key: RAW_DOCS_DIR
        value: ./data/raw_docs
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
