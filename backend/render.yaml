# Render Deployment Configuration for SwasthyaSaathi Backend
services:
  - type: web
    name: swasthya-saathi-backend
    env: python
    rootDir: backend
    region: singapore
    buildCommand: pip install -r requirements.txt && python -c "from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/all-MiniLM-L6-v2')" && python -m app.rag.ingest && python verify_sources.py --check-index
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VECTOR_STORE_DIR
        value: ./data/vector_store
      - key: RAW_DOCS_DIR
        value: ./data/raw_docs
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: INTEGRITY_MODE
        value: strict
      - key: DATABASE_URL
        sync: false
