# Render Deployment Configuration for SwasthyaSaathi Backend
services:
  - type: web
    name: swasthya-saathi-backend
    env: python
    rootDir: backend
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    renderSubdomainPolicy: enabled
    # Use the committed vector store; verify it instead of re-embedding every source on each deploy.
    buildCommand: export FASTEMBED_CACHE_PATH=./data/model_cache/fastembed HF_HOME=./data/model_cache/huggingface && mkdir -p "$FASTEMBED_CACHE_PATH" "$HF_HOME" && pip install -r requirements.txt && python -c "from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/all-MiniLM-L6-v2', threads=1)" && python -c "from fastembed.rerank.cross_encoder import TextCrossEncoder; TextCrossEncoder('Xenova/ms-marco-MiniLM-L-6-v2', threads=1, providers=['CPUExecutionProvider'])" && python verify_sources.py --check-index
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VECTOR_STORE_DIR
        value: ./data/vector_store
      - key: FASTEMBED_CACHE_PATH
        value: ./data/model_cache/fastembed
      - key: HF_HOME
        value: ./data/model_cache/huggingface
      - key: RAW_DOCS_DIR
        value: ./data/raw_docs
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: INTEGRITY_MODE
        value: strict
      - key: GATE_FAISS_FLOOR
        value: "0.45"
      - key: GATE_GLOBAL_THRESHOLD
        value: "-9.5"
      - key: GATE_MIN_CLUSTER_SAMPLES
        value: "12"
      - key: ENABLE_CONTENT_VERIFIER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: GAPS_HASH_SALT
        sync: false
